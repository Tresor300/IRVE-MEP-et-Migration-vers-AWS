name: Construire et pousser l'image

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostic — identité envoyée par GitHub
        run: |
          JETON=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$JETON" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud}'
      - uses: actions/checkout@v4

      - name: Obtenir des droits AWS temporaires
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::378436334328:role/github-actions-irve
          aws-region: eu-west-3

      - name: Se connecter au registre
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construire et pousser
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/irve-app:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "Image poussée : $IMAGE"