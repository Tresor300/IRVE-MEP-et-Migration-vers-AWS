prometheus:
  prometheusSpec:
    retention: 2h
    resources:
      requests:
        cpu: 100m
        memory: 300Mi
      limits:
        memory: 600Mi

grafana:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi