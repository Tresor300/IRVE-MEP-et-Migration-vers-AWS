apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: irve-app
  namespace: supervision
  labels:
    release: supervision
spec:
  interval: 30s
  module: http_2xx
  prober:
    url: sonde-prometheus-blackbox-exporter:9115
  targets:
    staticConfig:
      static:
        - http://irve-app.production.svc.cluster.local/health.php