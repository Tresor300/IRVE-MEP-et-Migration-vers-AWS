apiVersion: apps/v1
kind: Deployment
metadata:
  name: irve-app
spec:
  replicas: 2kubectl apply -f k8s/app-deployment.yaml
  selector:
    matchLabels:
      app: irve-app
  template:
    metadata:
      labels:
        app: irve-app
    spec:
      containers:
        - name: irve-app
          image: irve-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: DB_HOST
              value: irve-bdd
            - name: DB_NAME
              value: tv_fowet
            - name: DB_USER
              value: app_user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: irve-db
                  key: APP_DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health.php
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health.php
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
